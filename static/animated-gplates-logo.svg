<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Animated GPlates logo</title>
  <desc id="desc">A rotating, colour-changing GPlates logo.</desc>
  <style>
    @keyframes kaboom {
      0% { fill: blue; transform: scale(1); }
      50% { fill: red; transform: scale(0.4); }
      100% { fill: yellow; transform: scale(1); }
    }
    @keyframes rotate-teeth {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
      100% { transform: rotate(180deg); }
    }
    @keyframes hexagon {
      0% { fill: red; transform: rotate(0deg); }
      50% { fill: yellow; transform: rotate(-180deg); }
      100% { fill: blue; transform: rotate(-360deg); }
    }
    #big-g, #hexagon-with-teeth, #hexagon {
      transform-box: fill-box;
      transform-origin: center;
    }
    #big-g { animation: kaboom 5s ease alternate infinite; }
    #hexagon-with-teeth { animation: rotate-teeth 5s ease alternate infinite; }
    #hexagon { animation: hexagon 5s ease alternate infinite; }
    @media (prefers-reduced-motion: reduce) {
      #big-g, #hexagon-with-teeth, #hexagon { animation: none; }
    }
  </style>
  <defs>
    <filter id="dropshadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="15" dy="15" result="offsetblur" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <g id="hexagon" fill="white" stroke="none">
    <path d="m 616.05789,320.38773 -148.22281,256.72943 -296.44561,0 L 23.166656,320.38773 171.38947,63.65829 l 296.44561,0 148.22281,256.72944 z" />
  </g>
  <g id="hexagon-with-teeth" fill="#e91e00" stroke="none">
